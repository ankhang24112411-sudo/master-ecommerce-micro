eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
spring:
  mail:
    host: ${MAILTRAP_HOST}
    port: ${MAILTRAP_PORT:2525}
    username: ${MAILTRAP_USERNAME}
    password: ${MAILTRAP_PASSWORD}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  app:
    mail:
      from: ${MAIL_FROM:notification@example.com}
  application:
    name: notifications-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5435/product_db}
    username: postgres
    password: password
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 30
      compression-type: lz4

      properties:
        delivery.timeout.ms: 30000
        request.timeout.ms: 15000
        linger.ms: 0
        spring.json.add.type.headers: false

    consumer:
      group-id: product-service
      auto-offset-reset: earliest

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

        connect-timeout: 30000

  cache:
    type: redis
    redis:
      time-to-live: 60000

  jpa:
    show-sql: true

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: TRACE
    org.springframework.cache: TRACE
    com.github.benmanes.caffeine: DEBUG
    org.springframework.data.redis: DEBUG
