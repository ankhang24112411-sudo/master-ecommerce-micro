input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  if [app_name] {
    elasticsearch {
      hosts => ["http://vti-elasticsearch:9200"]

      # Ví dụ: order-service-logs-2026.08.30
      index => "%{app_name}-logs-%{+YYYY.MM.dd}"
    }
  } else {
    # Trường hợp log không có app_name
    elasticsearch {
      hosts => ["http://vti-elasticsearch:9200"]
      index => "unknown-service-logs-%{+YYYY.MM.dd}"
    }
  }

  # Hiển thị log trên console của Docker để kiểm tra
  stdout {
    codec => rubydebug
  }
}