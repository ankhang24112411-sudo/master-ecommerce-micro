eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
spring:
  application:
    name: order_service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5436/order_db}
    username: postgres
    password: password
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        delivery.timeout.ms: 30000 # Tổng thời gian tối đa để retry và gửi tin nhắn
        request.timeout.ms: 15000  # Thời gian chờ phản hồi cho từng request đơn lẻ
        linger.ms: 0               # Gửi ngay lập tức, không gom batch
jpa:
  show-sql: true
server:
  port: 8089