spring:
  application:
    name: order_service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5436/order_db}
    username: postgres
    password: password
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
jpa:
  show-sql: true
server:
  port: 8089